trigger: none

pool:
  name: B13-Pool

variables:
  azureServiceConnection: 'spring-boot-blog-app-azure'

  # ACR
  acrName: 'springbootblogacr'
  acrLoginServer: 'springbootblogacr.azurecr.io'
  imageRepository: 'spring-boot-blog-app'
  imageTag: '$(Build.BuildId)'

  # Azure Container App
  containerAppName: 'spring-boot-blog-app-dev'

  # Azure
  resourceGroup: 'spring-boot-blog-app-rg'

  # AKS
  aksClusterName: 'spring-boot-blog-aks'
  uatNamespace: 'uat'
  prodNamespace: 'prod'

  # SonarQube
  sonarProjectKey: 'spring-boot-blog-app'
  sonarHostUrl: 'http://localhost:9000'

stages:

# ============================================================
# SINGLE CI/CD STAGE
# ============================================================

- stage: CI_CD
  displayName: 'Complete CI/CD Pipeline'

  jobs:

  - job: CompletePipeline
    displayName: 'Terraform Build Scan and Deploy'

    steps:

    # ========================================================
    # 1. CHECKOUT SOURCE CODE
    # ========================================================

    - checkout: self
      fetchDepth: 0

    # ========================================================
    # 2. VERIFY TERRAFORM
    # ========================================================

    - powershell: |
    Write-Host "=========================================="
    Write-Host "Checking Terraform"
    Write-Host "=========================================="

    terraform version
  displayName: 'Verify Terraform'

    # ========================================================
    # 3. TERRAFORM INIT
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Build.SourcesDirectory)/terraform'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Terraform Init"
          Write-Host "=========================================="

          terraform init -reconfigure `
            -backend-config="resource_group_name=Lunatik-RG" `
            -backend-config="storage_account_name=qwertystoracc" `
            -backend-config="container_name=alpha-cont" `
            -backend-config="key=spring-boot-blog-app.tfstate"

    # ========================================================
    # 4. TERRAFORM PLAN
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Build.SourcesDirectory)/terraform'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Terraform Plan"
          Write-Host "=========================================="

          terraform plan

    # ========================================================
    # 5. TERRAFORM APPLY
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Terraform Apply'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Build.SourcesDirectory)/terraform'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Terraform Apply"
          Write-Host "=========================================="

          terraform apply -auto-approve

    # ========================================================
    # 6. VERIFY TERRAFORM RESOURCES
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Verify Azure Infrastructure'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Verifying DEV Container App"
          Write-Host "=========================================="

          az containerapp show `
            --name $(containerAppName) `
            --resource-group $(resourceGroup) `
            -o table

          Write-Host "=========================================="
          Write-Host "Verifying AKS"
          Write-Host "=========================================="

          az aks show `
            --name $(aksClusterName) `
            --resource-group $(resourceGroup) `
            -o table

    # ========================================================
    # 7. JAVA 21
    # ========================================================

    - powershell: |

        $env:JAVA_HOME = "C:\Program Files\Java\jdk-21.0.12"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "=========================================="
        Write-Host "Java Version"
        Write-Host "=========================================="

        java -version

        Write-Host "=========================================="
        Write-Host "Maven Version"
        Write-Host "=========================================="

        .\mvnw.cmd -version

      displayName: 'Configure Java 21'

    # ========================================================
    # 8. GITLEAKS
    # ========================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "Running Gitleaks"
        Write-Host "=========================================="

        gitleaks dir . --verbose

      displayName: 'Gitleaks Security Scan'

    # ========================================================
    # 9. CHECKSTYLE / LINT
    # ========================================================

    - powershell: |

        $env:JAVA_HOME = "C:\Program Files\Java\jdk-21.0.12"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "=========================================="
        Write-Host "Running Checkstyle"
        Write-Host "=========================================="

        .\mvnw.cmd checkstyle:check

      displayName: 'Checkstyle / Lint'

    # ========================================================
    # 10. MAVEN BUILD
    # ========================================================

    - powershell: |

        $env:JAVA_HOME = "C:\Program Files\Java\jdk-21.0.12"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "=========================================="
        Write-Host "Running Maven Build"
        Write-Host "=========================================="

        .\mvnw.cmd clean package -DskipTests

        Write-Host "=========================================="
        Write-Host "Generated JAR Files"
        Write-Host "=========================================="

        Get-ChildItem -Path target -Filter *.jar

      displayName: 'Maven Build with Java 21'

    # ========================================================
    # 11. SONARQUBE ANALYSIS
    # ========================================================

    - powershell: |

        $env:JAVA_HOME = "C:\Program Files\Java\jdk-21.0.12"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "=========================================="
        Write-Host "SonarQube Analysis"
        Write-Host "=========================================="

        .\mvnw.cmd sonar:sonar `
          "-Dsonar.projectKey=$(sonarProjectKey)" `
          "-Dsonar.host.url=$(sonarHostUrl)" `
          "-Dsonar.token=$(SONAR_TOKEN)" `
          "-Dsonar.qualitygate.wait=true"

      displayName: 'SonarQube Analysis'
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)

    # ========================================================
    # 12. SONARQUBE QUALITY GATE
    # ========================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "Checking SonarQube Quality Gate"
        Write-Host "=========================================="

        $projectKey = "$(sonarProjectKey)"
        $url = "$(sonarHostUrl)/api/qualitygates/project_status?projectKey=$projectKey"

        $headers = @{
          Authorization = "Bearer $env:SONAR_TOKEN"
        }

        $response = Invoke-RestMethod `
          -Uri $url `
          -Method Get `
          -Headers $headers

        $status = $response.projectStatus.status

        Write-Host "SonarQube Quality Gate Status: $status"

        if ($status -ne "OK") {
          Write-Error "SonarQube Quality Gate FAILED."
          exit 1
        }

        Write-Host "=========================================="
        Write-Host "SonarQube Quality Gate PASSED"
        Write-Host "=========================================="

      displayName: 'SonarQube Quality Gate'
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)

    # ========================================================
    # 13. DOCKER BUILD
    # ========================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "Docker Build"
        Write-Host "=========================================="

        docker build `
          -t "$(acrLoginServer)/$(imageRepository):$(imageTag)" `
          .

        Write-Host "Docker image:"
        Write-Host "$(acrLoginServer)/$(imageRepository):$(imageTag)"

      displayName: 'Docker Build'

    # ========================================================
    # 14. ACR PUSH
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Push Image to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Login to ACR"
          Write-Host "=========================================="

          az acr login --name $(acrName)

          Write-Host "=========================================="
          Write-Host "Push Image"
          Write-Host "=========================================="

          docker push "$(acrLoginServer)/$(imageRepository):$(imageTag)"

    # ========================================================
    # 15. DEPLOY DEV → CONTAINER APP
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Deploy DEV - Container App'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Deploying DEV Container App"
          Write-Host "=========================================="

          az containerapp update `
            --name $(containerAppName) `
            --resource-group $(resourceGroup) `
            --image "$(acrLoginServer)/$(imageRepository):$(imageTag)"

          Write-Host "DEV deployment completed."

    # ========================================================
    # 16. CONNECT TO AKS
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Connect to AKS'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Connecting to AKS"
          Write-Host "=========================================="

          az aks get-credentials `
            --resource-group $(resourceGroup) `
            --name $(aksClusterName) `
            --overwrite-existing

          kubectl get nodes

    # ========================================================
    # 17. DEPLOY UAT → AKS
    # ========================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "Deploying UAT"
        Write-Host "=========================================="

        kubectl apply -f kubernetes/namespace.yaml

        kubectl apply `
          -f kubernetes/deployment.yaml `
          -n $(uatNamespace)

        kubectl apply `
          -f kubernetes/service-uat.yaml `
          -n $(uatNamespace)

        kubectl set image `
          deployment/spring-boot-blog-app `
          spring-boot-blog-app="$(acrLoginServer)/$(imageRepository):$(imageTag)" `
          -n $(uatNamespace)

        kubectl rollout status `
          deployment/spring-boot-blog-app `
          -n $(uatNamespace) `
          --timeout=180s

        Write-Host "UAT deployment completed."

    # ========================================================
    # 18. DEPLOY PROD → AKS
    # ========================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "Deploying PROD"
        Write-Host "=========================================="

        kubectl apply `
          -f kubernetes/deployment.yaml `
          -n $(prodNamespace)

        kubectl apply `
          -f kubernetes/service-prod.yaml `
          -n $(prodNamespace)

        kubectl set image `
          deployment/spring-boot-blog-app `
          spring-boot-blog-app="$(acrLoginServer)/$(imageRepository):$(imageTag)" `
          -n $(prodNamespace)

        kubectl rollout status `
          deployment/spring-boot-blog-app `
          -n $(prodNamespace) `
          --timeout=180s

        Write-Host "PROD deployment completed."

    # ========================================================
    # 19. FINAL VERIFICATION
    # ========================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "FINAL DEPLOYMENT STATUS"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "DEV Container App:"
        az containerapp show `
          --name $(containerAppName) `
          --resource-group $(resourceGroup) `
          --query "{name:name,provisioningState:properties.provisioningState}" `
          -o table

        Write-Host ""
        Write-Host "UAT:"
        kubectl get pods -n $(uatNamespace)
        kubectl get svc -n $(uatNamespace)

        Write-Host ""
        Write-Host "PROD:"
        kubectl get pods -n $(prodNamespace)
        kubectl get svc -n $(prodNamespace)

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "CI/CD PIPELINE COMPLETED SUCCESSFULLY"
        Write-Host "=========================================="
