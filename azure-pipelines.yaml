trigger: none

pool:
  name: B13-Pool

variables:
  azureServiceConnection: 'spring-boot-blog-app-azure'
  acrName: 'springbootblogacr'
  acrLoginServer: 'springbootblogacr.azurecr.io'
  imageRepository: 'spring-boot-blog-app'
  imageTag: '$(Build.BuildId)'
  containerAppName: 'spring-boot-blog-app-dev'
  resourceGroup: 'spring-boot-blog-app-rg'
  aksClusterName: 'spring-boot-blog-aks'
  uatNamespace: 'uat'
  prodNamespace: 'prod'
  sonarProjectKey: 'spring-boot-blog-app'
  sonarHostUrl: 'http://localhost:9000'

stages:

# ============================================================
# SINGLE CI/CD STAGE
# ============================================================

- stage: CI_CD
  displayName: 'Complete CI/CD Pipeline'

  jobs:

  - job: Build_Test_Scan_Deploy
    displayName: 'Build, Scan and Deploy'

    steps:

    # ========================================================
    # 1. CHECKOUT
    # ========================================================

    - checkout: self
      fetchDepth: 0

    # ========================================================
    # 2. FORCE JAVA 21
    # ========================================================

    - powershell: |
        $env:JAVA_HOME = "C:\Program Files\Java\jdk-21.0.12"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "=========================================="
        Write-Host "Java Version"
        Write-Host "=========================================="

        java -version

        Write-Host "=========================================="
        Write-Host "Maven Version"
        Write-Host "=========================================="

        .\mvnw.cmd -version
      displayName: 'Configure Java 21'

    # ========================================================
    # 3. GITLEAKS
    # ========================================================

    - powershell: |
        Write-Host "=========================================="
        Write-Host "Running Gitleaks"
        Write-Host "=========================================="

        gitleaks dir . --verbose
      displayName: 'Gitleaks Security Scan'

    # ========================================================
    # 4. CHECKSTYLE / LINT
    # ========================================================

    - powershell: |
        $env:JAVA_HOME = "C:\Program Files\Java\jdk-21.0.12"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "=========================================="
        Write-Host "Running Checkstyle"
        Write-Host "=========================================="

        .\mvnw.cmd checkstyle:check
      displayName: 'Checkstyle / Lint'

    # ========================================================
    # 5. MAVEN BUILD
    # ========================================================

    - powershell: |
        $env:JAVA_HOME = "C:\Program Files\Java\jdk-21.0.12"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "=========================================="
        Write-Host "Running Maven Build"
        Write-Host "=========================================="

        .\mvnw.cmd clean package -DskipTests

        Write-Host "=========================================="
        Write-Host "Checking generated JAR"
        Write-Host "=========================================="

        Get-ChildItem -Path target -Filter *.jar
      displayName: 'Maven Build'

    # ========================================================
    # 6. SONARQUBE ANALYSIS
    # ========================================================

    - powershell: |
        $env:JAVA_HOME = "C:\Program Files\Java\jdk-21.0.12"
        $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"

        Write-Host "=========================================="
        Write-Host "Running SonarQube Analysis"
        Write-Host "=========================================="

        .\mvnw.cmd sonar:sonar `
          "-Dsonar.projectKey=$(sonarProjectKey)" `
          "-Dsonar.host.url=$(sonarHostUrl)" `
          "-Dsonar.token=$(SONAR_TOKEN)"
      displayName: 'SonarQube Analysis'
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)

    # ========================================================
    # 7. SONARQUBE QUALITY GATE
    # ========================================================

    - powershell: |
        Write-Host "=========================================="
        Write-Host "Checking SonarQube Quality Gate"
        Write-Host "=========================================="

        $projectKey = "$(sonarProjectKey)"
        $url = "$(sonarHostUrl)/api/qualitygates/project_status?projectKey=$projectKey"

        $headers = @{
          Authorization = "Bearer $env:SONAR_TOKEN"
        }

        $response = Invoke-RestMethod `
          -Uri $url `
          -Method Get `
          -Headers $headers

        $status = $response.projectStatus.status

        Write-Host "SonarQube Quality Gate Status: $status"

        if ($status -ne "OK") {
          Write-Error "SonarQube Quality Gate failed."
          exit 1
        }

        Write-Host "=========================================="
        Write-Host "SonarQube Quality Gate PASSED"
        Write-Host "=========================================="
      displayName: 'SonarQube Quality Gate'
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)

    # ========================================================
    # 8. DOCKER BUILD
    # ========================================================

    - powershell: |
        Write-Host "=========================================="
        Write-Host "Building Docker Image"
        Write-Host "=========================================="

        docker build `
          -t "$(acrLoginServer)/$(imageRepository):$(imageTag)" `
          .

        Write-Host "Docker image created:"
        Write-Host "$(acrLoginServer)/$(imageRepository):$(imageTag)"
      displayName: 'Docker Build'

    # ========================================================
    # 9. LOGIN TO AZURE + ACR PUSH
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Push Docker Image to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Logging into Azure Container Registry"
          Write-Host "=========================================="

          az acr login --name $(acrName)

          Write-Host "=========================================="
          Write-Host "Pushing Docker Image"
          Write-Host "=========================================="

          docker push "$(acrLoginServer)/$(imageRepository):$(imageTag)"

    # ========================================================
    # 10. DEPLOY DEV → AZURE CONTAINER APP
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Deploy DEV - Container App'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Deploying DEV Container App"
          Write-Host "=========================================="

          az containerapp update `
            --name $(containerAppName) `
            --resource-group $(resourceGroup) `
            --image "$(acrLoginServer)/$(imageRepository):$(imageTag)"

    # ========================================================
    # 11. CONNECT TO AKS
    # ========================================================

    - task: AzureCLI@2
      displayName: 'Connect to AKS'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          Write-Host "=========================================="
          Write-Host "Connecting to AKS"
          Write-Host "=========================================="

          az aks get-credentials `
            --resource-group $(resourceGroup) `
            --name $(aksClusterName) `
            --overwrite-existing

          kubectl get nodes

    # ========================================================
    # 12. DEPLOY UAT → AKS
    # ========================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "Deploying UAT"
        Write-Host "=========================================="

        kubectl apply -f kubernetes/namespace.yaml

        kubectl apply -f kubernetes/deployment.yaml `
          -n $(uatNamespace)

        kubectl apply -f kubernetes/service-uat.yaml `
          -n $(uatNamespace)

        kubectl set image deployment/spring-boot-blog-app `
          spring-boot-blog-app="$(acrLoginServer)/$(imageRepository):$(imageTag)" `
          -n $(uatNamespace)

        kubectl rollout status deployment/spring-boot-blog-app `
          -n $(uatNamespace) `
          --timeout=180s

        Write-Host "UAT deployment completed."

    # ========================================================
    # 13. DEPLOY PROD → AKS
    # ========================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "Deploying PROD"
        Write-Host "=========================================="

        kubectl apply -f kubernetes/deployment.yaml `
          -n $(prodNamespace)

        kubectl apply -f kubernetes/service-prod.yaml `
          -n $(prodNamespace)

        kubectl set image deployment/spring-boot-blog-app `
          spring-boot-blog-app="$(acrLoginServer)/$(imageRepository):$(imageTag)" `
          -n $(prodNamespace)

        kubectl rollout status deployment/spring-boot-blog-app `
          -n $(prodNamespace) `
          --timeout=180s

        Write-Host "PROD deployment completed."

    # ========================================================
    # 14. FINAL VERIFICATION
    # ========================================================

    - powershell: |

        Write-Host "=========================================="
        Write-Host "FINAL DEPLOYMENT STATUS"
        Write-Host "=========================================="

        Write-Host ""
        Write-Host "UAT:"
        kubectl get pods -n $(uatNamespace)
        kubectl get svc -n $(uatNamespace)

        Write-Host ""
        Write-Host "PROD:"
        kubectl get pods -n $(prodNamespace)
        kubectl get svc -n $(prodNamespace)

        Write-Host ""
        Write-Host "=========================================="
        Write-Host "CI/CD PIPELINE COMPLETED SUCCESSFULLY"
        Write-Host "=========================================="
